name: Verify Apify credentials (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veriflow-apify-credential-check
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Unity20092024/Veriflow' && github.ref == 'refs/heads/feature/step-1-private-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check secret presence and read-only account authentication
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_PAID_RUNS_ENABLED: 'false'
          APIFY_MAX_RUN_USD: '0'
          APIFY_ROLLING_24H_BUDGET_USD: '0'
          APIFY_MAX_RECORDS: '20'
        run: |
          python -m veriflow apify-config
          python -m veriflow apify-check
